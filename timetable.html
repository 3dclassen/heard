<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HEARD">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <title>HEARD — Mein Timetable</title>
</head>
<body>

  <div id="app-shell" class="visible">
    <div class="offline-banner" id="offline-banner"></div>

    <nav class="nav">
      <a href="./index.html" class="nav-logo">H<span>D</span></a>
      <button id="nav-festival" class="nav-festival" style="display:none"></button>
      <div class="nav-links">
        <a href="./index.html"     class="nav-link" data-i18n="nav.artists">Artists</a>
        <a href="./timetable.html" class="nav-link active" data-i18n="nav.timetable">Timetable</a>
        <a href="./crew.html"      class="nav-link" data-i18n="nav.crew">Crew</a>
        <a href="./recap.html"     class="nav-link" data-i18n="nav.recap">Recap</a>
        <a href="./help.html"      class="nav-link" data-i18n="nav.help">Hilfe</a>
        <a href="./admin.html"     class="nav-link" id="nav-admin" style="display:none" data-i18n="nav.admin">Admin</a>
      </div>
      <div class="lang-toggle">
        <button class="lang-toggle-btn active" data-lang="de">DE</button>
        <span class="lang-toggle-sep">|</span>
        <button class="lang-toggle-btn" data-lang="en">EN</button>
      </div>
      <div class="nav-avatar" id="nav-avatar">
        <img id="nav-avatar-img" src="" alt="Avatar">
      </div>
    </nav>

    <main class="main">
      <h1 class="page-title" data-i18n="timetable.title">Mein Timetable</h1>
      <div id="timetable-content">
        <div class="loader"><div class="spinner"></div> <span data-i18n="loading.generic">Lade...</span></div>
      </div>
    </main>

    <button id="btn-logout" style="display:none"></button>
  </div>

  <!-- ── Profil-Modal ── -->
  <div class="panel-backdrop" id="profile-backdrop"></div>
  <div class="panel" id="profile-panel" role="dialog" aria-modal="true" aria-label="Profil">
    <div class="panel-handle"></div>
    <div class="panel-content" id="profile-content"></div>
  </div>

  <!-- ── Festival Switcher Panel ── -->
  <div class="panel-backdrop" id="festival-backdrop"></div>
  <div class="panel" id="festival-panel" role="dialog" aria-modal="true" aria-label="Festival wechseln">
    <div class="panel-handle"></div>
    <div class="panel-content" id="festival-content"></div>
  </div>

  <script src="./version.js"></script>
  <script type="module" src="./js/sw-register.js"></script>
  <script type="module" src="./js/timetable.js"></script>
</body>
</html>
